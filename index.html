<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Tasker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f1;color:#20352c;font:16px Arial,sans-serif}
main{max-width:960px;margin:36px auto;padding:24px}
h1{margin:0 0 8px;font-size:40px}
p{color:#68766e;line-height:1.5}
.panel{margin-top:20px;padding:24px;border:1px solid #e0e5df;border-radius:12px;background:#fff}
label{display:block;margin:18px 0 9px;font-weight:bold}
input[type=file],textarea{width:100%}
textarea{min-height:130px;padding:12px;border:1px solid #cfd8d0;border-radius:7px;font:inherit;line-height:1.5}
button{padding:11px 16px;border:0;border-radius:7px;background:#287452;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#fileList button{margin:5px 6px 5px 0;padding:7px 10px;background:#edf3ee;color:#315c45;font-weight:normal}
#fileList button.active{background:#287452;color:#fff}
#message{white-space:pre-wrap}
pre{max-height:420px;overflow:auto;padding:16px;border-radius:7px;background:#f5f7f4;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Document Tasker</h1>
  <p>Upload a file, describe the result you want, then review and download it. Formula columns are created automatically from your instruction.</p>

  <section class="panel">
    <label for="files">1. Choose files</label>
    <input id="files" type="file" multiple>
    <div id="fileList"></div>
    <p id="message">Select one or more files to begin.</p>

    <label for="instruction">2. Describe what you want</label>
    <textarea id="instruction" placeholder="For example:
Using information from the Data, create 2 new columns:
1. Phone numbers, following the order of names and matching each guest.
2. Table names and numbers, following the order and matching each guest."></textarea>

    <button id="apply" disabled>Apply instruction to selected file</button>
  </section>

  <section class="panel">
    <strong>Result</strong>
    <p id="note">Your result will appear here.</p>
    <pre id="result">No result yet.</pre>
    <button id="download" disabled>Download result</button>
  </section>
</main>

<script type="module">
const fileInput = document.querySelector('#files');
const fileList = document.querySelector('#fileList');
const instructionInput = document.querySelector('#instruction');
const message = document.querySelector('#message');
const applyButton = document.querySelector('#apply');
const note = document.querySelector('#note');
const resultBox = document.querySelector('#result');
const downloadButton = document.querySelector('#download');

let files = [];
let activeIndex = -1;
let resultBlob = null;
let resultName = '';
let xlsxModule;

async function getXLSX() {
  if (!xlsxModule) {
    const module = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
    xlsxModule = module.default || module;
  }
  return xlsxModule;
}

function ext(name) {
  return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
}

function normalize(value) {
  return String(value ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function findHeaderRow(rows) {
  let bestIndex = -1;
  let bestScore = 0;

  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const values = rows[i].map(normalize);
    let score = 0;
    if (values.some(v => /guestname|fullname|personname|^name$/.test(v))) score += 3;
    if (values.some(v => /phone|mobile|telephone|contact|whatsapp|qrcode|qrto/.test(v))) score += 3;
    if (values.some(v => /table|seat/.test(v))) score += 2;
    if (score > bestScore) {
      bestScore = score;
      bestIndex = i;
    }
  }

  return bestIndex >= 0 ? bestIndex : rows.findIndex(row =>
    row.some(value => String(value).trim() !== '')
  );
}

function findColumn(headers, kind) {
  const normalized = headers.map(normalize);

  if (kind === 'phone') {
    return normalized.findIndex(value =>
      /phone|mobile|telephone|contact|whatsapp|qrcode|qrto/.test(value)
    );
  }

  if (kind === 'tableName') {
    return normalized.findIndex(value => /tablename/.test(value));
  }

  if (kind === 'tableNumber') {
    return normalized.findIndex(value => /table(number|no|num)?$|seat(number|no|num)?$/.test(value));
  }

  return -1;
}

function cellRef(XLSX, rowNumber, columnIndex) {
  return XLSX.utils.encode_cell({ r: rowNumber - 1, c: columnIndex });
}

function autoColumns(instruction, headers, XLSX, firstRow) {
  const text = instruction.toLowerCase();
  const asksForPhone = /phone|mobile|telephone|contact|qr code/.test(text);
  const asksForTable = /table name|table number|table no|table names|table numbers/.test(text);
  const asksForTwo = /2\s+new columns|two\s+new columns|create\s+2\s+columns/.test(text);

  const phoneIndex = findColumn(headers, 'phone');
  const tableNameIndex = findColumn(headers, 'tableName');
  const tableNumberIndex = findColumn(headers, 'tableNumber');

  const columns = [];

  if ((asksForPhone || asksForTwo) && phoneIndex >= 0) {
    columns.push({
      name: 'PHONE NUMBERS',
      makeFormula: row => {
        const phone = cellRef(XLSX, row, phoneIndex);
        return `IF(${phone}="","",${phone})`;
      }
    });
  }

  if ((asksForTable || asksForTwo) && (tableNameIndex >= 0 || tableNumberIndex >= 0)) {
    columns.push({
      name: 'TABLE NAMES AND NUMBERS',
      makeFormula: row => {
        const name = tableNameIndex >= 0 ? cellRef(XLSX, row, tableNameIndex) : '';
        const number = tableNumberIndex >= 0 ? cellRef(XLSX, row, tableNumberIndex) : '';
        if (name && number) {
          return `IF(${number}="","",IF(${name}="", "Table "&${number},${name}&" "&${number}))`;
        }
        const source = name || number;
        return `IF(${source}="","",IF(ISNUMBER(SEARCH("table",${source})),${source},"Table "&${source}))`;
      }
    });
  }

  return columns;
}

function getFilterPhrase(instruction) {
  const match = instruction.match(/(?:containing|with|named|at|for)\s+["“]?([^"”.,;]+)["”]?/i);
  return match?.[1]?.trim() || '';
}

async function readFile(file) {
  const extension = ext(file.name);

  if (['xlsx','xls','xlsm','xlsb','csv','tsv','ods'].includes(extension)) {
    const XLSX = await getXLSX();
    const bytes = new Uint8Array(await file.arrayBuffer());
    const workbook = XLSX.read(bytes, { type: 'array', cellFormula: true });
    return { name: file.name, extension, kind: 'spreadsheet', bytes, workbook };
  }

  if (['txt','md','json','xml','html','htm','log'].includes(extension)) {
    return { name: file.name, extension, kind: 'text', text: await file.text() };
  }

  if (extension === 'docx') {
    const module = await import('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/+esm');
    const mammoth = module.default || module;
    const value = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { name: file.name, extension, kind: 'text', text: value.value };
  }

  if (extension === 'pdf') {
    const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/+esm');
    pdfjs.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    const pages = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(content.items.map(item => item.str).join(' '));
    }

    return { name: file.name, extension, kind: 'text', text: pages.join('\n\n') };
  }

  throw new Error('This file was selected, but this version does not yet read its format.');
}

function selectFile(index) {
  activeIndex = index;
  [...fileList.querySelectorAll('button')].forEach(button => {
    button.classList.toggle('active', Number(button.dataset.index) === index);
  });
  resultBlob = null;
  downloadButton.disabled = true;
  resultBox.textContent = 'No result yet.';
  note.textContent = 'Your result will appear here.';
  message.textContent = files[index].error || `${files[index].name} is ready.`;
  applyButton.disabled = !!files[index].error || !instructionInput.value.trim();
}

fileInput.addEventListener('change', async () => {
  files = [];
  activeIndex = -1;
  fileList.innerHTML = '';
  applyButton.disabled = true;
  downloadButton.disabled = true;
  resultBox.textContent = 'No result yet.';

  const chosen = [...fileInput.files];
  if (!chosen.length) return;

  message.textContent = `Reading ${chosen.length} file(s)…`;

  files = await Promise.all(chosen.map(async file => {
    try { return await readFile(file); }
    catch (error) {
      return { name: file.name, extension: ext(file.name), error: error.message };
    }
  }));

  files.forEach((file, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = file.name;
    button.dataset.index = String(index);
    button.addEventListener('click', () => selectFile(index));
    fileList.append(button);
  });

  const unreadable = files.filter(file => file.error).length;
  message.textContent = unreadable
    ? `${chosen.length} file(s) selected. ${unreadable} could not be read.`
    : `All ${chosen.length} file(s) are ready.`;

  selectFile(0);
  fileInput.value = '';
});

instructionInput.addEventListener('input', () => {
  const file = files[activeIndex];
  applyButton.disabled = !file || !!file.error || !instructionInput.value.trim();
});

applyButton.addEventListener('click', async () => {
  const file = files[activeIndex];
  const instruction = instructionInput.value.trim();
  if (!file || !instruction) return;

  applyButton.disabled = true;
  downloadButton.disabled = true;
  resultBlob = null;
  message.textContent = 'Working on your instruction…';

  try {
    if (file.kind === 'spreadsheet') {
      const XLSX = await getXLSX();
      const workbook = XLSX.read(file.bytes, { type: 'array', cellFormula: true });
      const phrase = getFilterPhrase(instruction);
      const shouldFilter = /\b(only|filter|show|keep|bring out)\b/i.test(instruction) && phrase;
      const reorder = instruction.match(/(?:reorder|arrange|put)\s+columns?\s*:?\s*(.+)/i);
      const sort = instruction.match(/(?:sort|order)\s+rows?\s+by\s+["“]?([^,"”]+?)["”]?(?:\s+(ascending|descending|a to z|z to a))?(?:[.!?]|$)/i);
      const formulaNotes = [];
      let added = 0;

      for (const sheetName of workbook.SheetNames) {
        const sheet = workbook.Sheets[sheetName];
        if (!sheet['!ref']) continue;

        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1, defval: '', raw: true, blankrows: true
        });
        const headerIndex = findHeaderRow(rows);
        if (headerIndex < 0) continue;

        let headers = rows[headerIndex].map(value => String(value ?? '').trim());
        let data = rows.slice(headerIndex + 1);

        if (shouldFilter) {
          const needle = phrase.toLowerCase();
          data = data.filter(row =>
            row.some(value => String(value).toLowerCase().includes(needle))
          );
        }

        if (reorder) {
          const wanted = reorder[1].split(/,|\s+then\s+/i)
            .map(value => value.replace(/["'“”]/g, '').trim()).filter(Boolean);
          const requested = wanted.map(name =>
            headers.find(header => header.toLowerCase() === name.toLowerCase())
          ).filter(Boolean);

          if (requested.length) {
            const ordered = [...requested, ...headers.filter(header => !requested.includes(header))];
            const indexes = ordered.map(header => headers.indexOf(header));
            data = data.map(row => indexes.map(index => row[index] ?? ''));
            headers = ordered;
          }
        }

        if (sort) {
          const sortIndex = headers.findIndex(
            header => header.toLowerCase() === sort[1].trim().toLowerCase()
          );
          if (sortIndex >= 0) {
            const descending = /descending|z to a/i.test(sort[2] || '');
            data.sort((a, b) => {
              const order = String(a[sortIndex] ?? '').localeCompare(
                String(b[sortIndex] ?? ''), undefined,
                { numeric: true, sensitivity: 'base' }
              );
              return descending ? -order : order;
            });
          }
        }

        const automatic = autoColumns(instruction, headers, XLSX, headerIndex + 2);

        for (const column of automatic) {
          const existing = headers.findIndex(
            header => header.toLowerCase() === column.name.toLowerCase()
          );
          if (existing < 0) {
            headers.push(column.name);
            added++;
          }
          formulaNotes.push(`${column.name}: formula created automatically from the matching source column.`);
        }

        const outputRows = [...rows.slice(0, headerIndex), headers];

        data.forEach((row, rowIndex) => {
          const rowNumber = headerIndex + rowIndex + 2;
          const output = [...row];

          automatic.forEach(column => {
            let columnIndex = headers.findIndex(
              header => header.toLowerCase() === column.name.toLowerCase()
            );
            while (output.length < headers.length) output.push('');
            output[columnIndex] = { formula: column.makeFormula(rowNumber) };
          });

          outputRows.push(output);
        });

        const newSheet = XLSX.utils.aoa_to_sheet(
          outputRows.map(row => row.map(value =>
            value && typeof value === 'object' && value.formula
              ? { f: value.formula }
              : value
          ))
        );

        if (sheet['!cols']) newSheet['!cols'] = sheet['!cols'];
        workbook.Sheets[sheetName] = newSheet;
      }

      if (/phone|mobile|table|new columns/i.test(instruction) && added === 0 && !formulaNotes.length) {
        throw new Error('I could not match the requested phone or table information to columns in this workbook. Check that the workbook has phone and table headings.');
      }

      workbook.Workbook ||= {};
      workbook.Workbook.CalcPr = { calcMode: 'auto', fullCalcOnLoad: true, forceFullCalc: true };

      const preview = workbook.SheetNames.map(name =>
        `Sheet: ${name}\n${XLSX.utils.sheet_to_csv(workbook.Sheets[name])}`
      ).join('\n\n');

      const changes = [];
      if (shouldFilter) changes.push(`kept rows containing “${phrase}”`);
      if (reorder) changes.push('reordered columns');
      if (sort) changes.push(`sorted rows by ${sort[1].trim()}`);
      if (added) changes.push(`created ${added} new column(s) and generated their formulas`);
      if (!changes.length) changes.push('prepared the spreadsheet');

      const bytes = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
      resultBlob = new Blob([bytes], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
      resultName = `${file.name.replace(/\.[^.]+$/, '')}-result.xlsx`;
      resultBox.textContent =
        (formulaNotes.length ? `Automatically generated columns:\n${formulaNotes.join('\n')}\n\n` : '') +
        preview;
      note.textContent = `Completed: ${changes.join(', ')}.`;
    } else {
      const phrase = getFilterPhrase(instruction);
      const filter = phrase && /\b(only|filter|show|keep|bring out)\b/i.test(instruction);
      const lines = file.text.split(/\r?\n/);
      const output = filter
        ? lines.filter(line => line.toLowerCase().includes(phrase.toLowerCase()))
        : lines;

      resultBox.textContent = output.join('\n') || 'No matching text found.';
      note.textContent = filter
        ? `Showing ${output.length} line(s) containing “${phrase}”.`
        : 'File text is ready to review.';
      resultBlob = new Blob([output.join('\n')], { type: 'text/plain;charset=utf-8' });
      resultName = `${file.name.replace(/\.[^.]+$/, '')}-result.txt`;
    }

    downloadButton.disabled = false;
    message.textContent = 'Done. Review the result and download it.';
  } catch (error) {
    message.textContent = error.message || 'Could not complete that instruction.';
    note.textContent = 'The result could not be created.';
    resultBox.textContent = 'Review the message above.';
  } finally {
    applyButton.disabled = false;
  }
});

downloadButton.addEventListener('click', () => {
  if (!resultBlob) return;
  const link = document.createElement('a');
  const url = URL.createObjectURL(resultBlob);
  link.href = url;
  link.download = resultName;
  link.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
