<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Tasker</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #203a31;
      background: #f6f7f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    h1 { margin: 0 0 10px; font-size: 38px; }

    .intro, .muted { color: #718079; line-height: 1.55; }

    .card {
      margin-top: 24px;
      padding: 28px;
      background: white;
      border: 1px solid #dce5df;
      border-radius: 14px;
    }

    h2 { margin: 0 0 16px; font-size: 21px; }

    input[type="file"], textarea, button { font: inherit; }

    input[type="file"] { max-width: 100%; }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      border: 1px solid #cbd8d0;
      border-radius: 9px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      margin-top: 16px;
      padding: 13px 20px;
      color: white;
      background: #287653;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: #9cb9aa;
      cursor: not-allowed;
    }

    #message { min-height: 24px; margin: 14px 0 0; color: #61746a; }

    #error { color: #a12b2b; }

    #preview {
      max-height: 420px;
      overflow: auto;
      border-radius: 8px;
      background: #f4f7f4;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px 12px;
      border: 1px solid #dce5df;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th { background: #edf3ef; }

    .sheet-title { margin: 18px 0 8px; font-weight: 700; }

    .small { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Document Tasker</h1>
    <p class="intro">
      Choose a file, describe the result you want, then review and download it.
      For Excel guest lists, you can ask for names and phone numbers in two columns.
    </p>

    <section class="card">
      <h2>1. Choose a file</h2>
      <input id="fileInput" type="file" multiple>
      <div id="fileList" class="muted small"></div>

      <h2 style="margin-top:26px">2. Describe what you want</h2>
      <textarea id="instruction">Only give me two columns:
1. A column with all the names
2. A column with all the phone numbers</textarea>

      <button id="applyButton" type="button">Apply instruction to selected file</button>
      <p id="message" role="status"></p>
      <p id="error" role="alert"></p>
    </section>

    <section class="card">
      <h2>Result</h2>
      <p id="resultSummary" class="muted">Your result will appear here.</p>
      <div id="preview"></div>
      <button id="downloadButton" type="button" disabled>Download result</button>
    </section>
  </main>

  <script type="module">
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const instructionInput = document.getElementById("instruction");
    const applyButton = document.getElementById("applyButton");
    const downloadButton = document.getElementById("downloadButton");
    const message = document.getElementById("message");
    const error = document.getElementById("error");
    const preview = document.getElementById("preview");
    const resultSummary = document.getElementById("resultSummary");

    let downloadBlob = null;
    let downloadName = "";

    fileInput.addEventListener("change", () => {
      const files = [...fileInput.files];
      fileList.textContent = files.length
        ? files.map(file => file.name).join(", ")
        : "No files selected.";

      clearResult();
    });

    applyButton.addEventListener("click", async () => {
      clearResult();

      const file = fileInput.files[0];
      const instruction = instructionInput.value.trim();

      if (!file) {
        showError("Choose a file first.");
        return;
      }
      if (!instruction) {
        showError("Enter the result you want.");
        return;
      }

      applyButton.disabled = true;
      message.textContent = "Reading your file…";

      try {
        const extension = getExtension(file.name);

        if (["xlsx", "xls", "xlsm", "xlsb", "csv", "tsv", "ods"].includes(extension)) {
          const result = await handleSpreadsheet(file, instruction);
          downloadBlob = result.blob;
          downloadName = result.filename;
          showSpreadsheetPreview(result.previewSheets, result.rowCount);
          resultSummary.textContent =
            `Prepared ${result.rowCount} name and phone-number rows from ${result.sheetCount} sheet(s).`;
        } else {
          throw new Error(
            `This page can select any file, but this version processes Excel workbooks, CSV, and TSV files. The selected file is .${extension || "unknown"}.`
          );
        }

        downloadButton.disabled = false;
        message.textContent = "Done. Review the result, then download it.";
      } catch (err) {
        showError(err instanceof Error ? err.message : "The result could not be created.");
        message.textContent = "";
        resultSummary.textContent = "The requested result could not be created.";
      } finally {
        applyButton.disabled = false;
      }
    });

    downloadButton.addEventListener("click", () => {
      if (!downloadBlob) return;

      const url = URL.createObjectURL(downloadBlob);
      const link = document.createElement("a");
      link.href = url;
      link.download = downloadName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    async function handleSpreadsheet(file, instruction) {
      const wantsNames = /\bname(s)?\b/i.test(instruction);
      const wantsPhones = /\b(phone|telephone|mobile|cell)\b/i.test(instruction);

      if (!wantsNames || !wantsPhones) {
        throw new Error(
          "For this spreadsheet task, describe both the names and phone numbers you want extracted."
        );
      }

      const XLSX = await loadSheetLibrary();
      const bytes = new Uint8Array(await file.arrayBuffer());
      const sourceWorkbook = XLSX.read(bytes, { type: "array", cellDates: false });
      const resultWorkbook = XLSX.utils.book_new();
      const previewSheets = [];
      let totalRows = 0;

      for (const sourceSheetName of sourceWorkbook.SheetNames) {
        const sourceSheet = sourceWorkbook.Sheets[sourceSheetName];
        const rows = XLSX.utils.sheet_to_json(sourceSheet, {
          header: 1,
          raw: true,
          defval: "",
          blankrows: true
        });

        const match = findNameAndPhoneColumns(rows);
        if (!match) continue;

        const outputRows = [["NAME", "PHONE NUMBER"]];

        for (let rowIndex = match.headerRow + 1; rowIndex < rows.length; rowIndex++) {
          const row = rows[rowIndex] || [];
          const name = cellText(XLSX, sourceSheet, rowIndex, match.nameColumn, row[match.nameColumn]);
          const phone = cellText(XLSX, sourceSheet, rowIndex, match.phoneColumn, row[match.phoneColumn]);

          if (!name && !phone) continue;

          // Skip repeated header rows that appear inside a sheet.
          if (normalize(name) === "name" && normalize(phone).includes("phone")) continue;

          outputRows.push([name, phone]);
        }

        if (outputRows.length === 1) continue;

        const outputSheet = XLSX.utils.aoa_to_sheet(outputRows, { cellDates: false });
        const outputName = uniqueSheetName(sourceSheetName, resultWorkbook.SheetNames);
        XLSX.utils.book_append_sheet(resultWorkbook, outputSheet, outputName);

        const dataRows = outputRows.slice(1);
        totalRows += dataRows.length;
        previewSheets.push({ name: outputName, rows: outputRows.slice(0, 31) });
      }

      if (!previewSheets.length) {
        const names = sourceWorkbook.SheetNames.join(", ");
        throw new Error(
          `I could not find a sheet with both a name column and a phone-number column. Sheets checked: ${names}. Make sure the workbook has headings such as NAME and PHONE NO.`
        );
      }

      const outputBytes = XLSX.write(resultWorkbook, {
        bookType: "xlsx",
        type: "array"
      });

      return {
        blob: new Blob([outputBytes], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        }),
        filename: `${removeExtension(file.name)}-names-and-phone-numbers.xlsx`,
        previewSheets,
        rowCount: totalRows,
        sheetCount: previewSheets.length
      };
    }

    function findNameAndPhoneColumns(rows) {
      const scanLimit = Math.min(rows.length, 60);
      let best = null;
      let bestScore = 0;

      for (let rowIndex = 0; rowIndex < scanLimit; rowIndex++) {
        const row = rows[rowIndex] || [];
        let nameColumn = -1;
        let phoneColumn = -1;
        let nameScore = 0;
        let phoneScore = 0;

        row.forEach((value, columnIndex) => {
          const header = normalize(value);

          // Prefer the exact NAME heading over NAME + ADDITIONAL INFO.
          const thisNameScore =
            header === "name" ? 10 :
            ["guestname", "fullname", "guestfullname"].includes(header) ? 8 :
            header.includes("name") && !header.includes("additional") ? 5 : 0;

          const thisPhoneScore =
            ["phoneno", "phonenumber", "telephone", "mobileno", "mobilenumber", "cellphone"].includes(header) ? 10 :
            header.includes("phone") || header.includes("mobile") || header.includes("telephone") ? 7 : 0;

          if (thisNameScore > nameScore) {
            nameScore = thisNameScore;
            nameColumn = columnIndex;
          }
          if (thisPhoneScore > phoneScore) {
            phoneScore = thisPhoneScore;
            phoneColumn = columnIndex;
          }
        });

        if (nameColumn >= 0 && phoneColumn >= 0) {
          const score = nameScore + phoneScore;
          if (score > bestScore) {
            best = { headerRow: rowIndex, nameColumn, phoneColumn };
            bestScore = score;
          }
        }
      }

      return best;
    }

    function cellText(XLSX, sheet, rowIndex, columnIndex, fallbackValue) {
      const address = XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex });
      const cell = sheet[address];

      if (cell) {
        // Formatting the original cell helps preserve phone-number display.
        const formatted = XLSX.utils.format_cell(cell);
        if (formatted !== undefined && formatted !== null) return String(formatted).trim();
      }

      return fallbackValue === undefined || fallbackValue === null
        ? ""
        : String(fallbackValue).trim();
    }

    function normalize(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function uniqueSheetName(sourceName, existingNames) {
      let base = String(sourceName || "Data").replace(/[\\/?*[\]:]/g, " ").trim().slice(0, 31) || "Data";
      let candidate = base;
      let number = 2;

      while (existingNames.includes(candidate)) {
        const suffix = ` ${number++}`;
        candidate = base.slice(0, 31 - suffix.length) + suffix;
      }

      return candidate;
    }

    function showSpreadsheetPreview(sheets, totalRows) {
      preview.replaceChildren();

      for (const sheet of sheets) {
        const title = document.createElement("div");
        title.className = "sheet-title";
        title.textContent = `Sheet: ${sheet.name}`;
        preview.appendChild(title);

        const table = document.createElement("table");
        const head = document.createElement("thead");
        const body = document.createElement("tbody");
        const headerRow = document.createElement("tr");

        for (const heading of sheet.rows[0]) {
          const th = document.createElement("th");
          th.textContent = heading;
          headerRow.appendChild(th);
        }
        head.appendChild(headerRow);

        for (const row of sheet.rows.slice(1)) {
          const tr = document.createElement("tr");
          for (const value of row) {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }

        table.append(head, body);
        preview.appendChild(table);
      }

      if (totalRows > 30) {
        const note = document.createElement("p");
        note.className = "muted small";
        note.textContent = `Preview shows up to 30 rows per sheet. The download contains all ${totalRows} rows.`;
        preview.appendChild(note);
      }
    }

    async function loadSheetLibrary() {
      try {
        const module = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
        return module.default || module;
      } catch {
        throw new Error(
          "The spreadsheet reader could not load. Check your internet connection and reload the page."
        );
      }
    }

    function getExtension(filename) {
      const index = filename.lastIndexOf(".");
      return index < 0 ? "" : filename.slice(index + 1).toLowerCase();
    }

    function removeExtension(filename) {
      return filename.replace(/\.[^.]+$/, "");
    }

    function showError(text) {
      error.textContent = text;
    }

    function clearResult() {
      downloadBlob = null;
      downloadName = "";
      downloadButton.disabled = true;
      message.textContent = "";
      error.textContent = "";
      resultSummary.textContent = "Your result will appear here.";
      preview.replaceChildren();
    }
  </script>
</body>
</html>
