<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Tasker</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #20352c;
      background: #f6f6f1;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      max-width: 900px;
      margin: 48px auto;
      padding: 24px;
    }

    h1 { margin-bottom: 8px; font-size: 42px; }

    .intro { color: #68766e; line-height: 1.5; }

    .panel {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid #e0e5df;
      border-radius: 12px;
      background: white;
    }

    label {
      display: block;
      margin: 18px 0 9px;
      font-weight: bold;
    }

    input[type="file"], textarea { width: 100%; }

    textarea {
      min-height: 110px;
      padding: 12px;
      border: 1px solid #cfd8d0;
      border-radius: 7px;
      font: inherit;
      line-height: 1.5;
    }

    button {
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #287452;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #message { color: #68766e; }

    pre {
      overflow: auto;
      white-space: pre-wrap;
      padding: 16px;
      border-radius: 7px;
      background: #f5f7f4;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Document Tasker</h1>
    <p class="intro">
      Upload a document, describe what you want to find, and review the matching text.
      Files are read in your browser.
    </p>

    <section class="panel">
      <label for="file">1. Choose a file</label>
      <input id="file" type="file" accept=".txt,.csv,.md">
      <p id="message">This starter version supports text, CSV, and Markdown files.</p>

      <label for="instruction">2. Describe what you want</label>
      <textarea id="instruction"
        placeholder="For example: Show me only the lines containing Table 4"></textarea>

      <button id="run" disabled>Find matching lines</button>
    </section>

    <section class="panel">
      <label>Result</label>
      <pre id="result">Your result will appear here.</pre>
      <button id="download" disabled>Download result</button>
    </section>
  </main>

  <script>
    const fileInput = document.querySelector("#file");
    const instructionInput = document.querySelector("#instruction");
    const runButton = document.querySelector("#run");
    const downloadButton = document.querySelector("#download");
    const message = document.querySelector("#message");
    const resultBox = document.querySelector("#result");

    let fileText = "";
    let resultText = "";

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileText = "";
      resultText = "";
      runButton.disabled = true;
      downloadButton.disabled = true;
      resultBox.textContent = "Your result will appear here.";

      if (!file) return;

      try {
        fileText = await file.text();
        message.textContent = `Loaded ${file.name}.`;
        runButton.disabled = false;
      } catch {
        message.textContent = "Could not read that file.";
      }
    });

    runButton.addEventListener("click", () => {
      const instruction = instructionInput.value.trim();

      if (!instruction) {
        message.textContent = "Please describe what you want to find.";
        return;
      }

      const match = instruction.match(
        /(?:containing|with|named)\s+["“]?(.+?)["”]?\s*$/i
      );

      const phrase = (match ? match[1] : instruction)
        .replace(/[.!?]+$/, "")
        .trim()
        .toLowerCase();

      const matches = fileText
        .split(/\r?\n/)
        .filter(line => line.toLowerCase().includes(phrase));

      resultText = matches.length
        ? matches.join("\n")
        : `No lines found containing “${phrase}”.`;

      resultBox.textContent = resultText;
      downloadButton.disabled = matches.length === 0;
      message.textContent = `Found ${matches.length} matching line(s). Review the result.`;
    });

    downloadButton.addEventListener("click", () => {
      const blob = new Blob([resultText], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "document-tasker-result.txt";
      link.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
