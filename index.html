<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Tasker</title>

  <!-- Load SheetJS as a browser script so it uses window.XLSX. -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; background: #f6f7f2; color: #203a31; font: 16px Arial, sans-serif; }
    main { width: min(100%, 1000px); margin: auto; }
    h1 { font-size: 38px; margin: 0 0 8px; }
    h2 { font-size: 21px; margin: 0 0 16px; }
    p { line-height: 1.5; }
    .muted { color: #718079; }
    .card { margin-top: 24px; padding: 28px; background: white; border: 1px solid #dce5df; border-radius: 14px; }
    textarea { width: 100%; min-height: 145px; padding: 14px; border: 1px solid #cbd8d0; border-radius: 9px; resize: vertical; font: inherit; line-height: 1.5; }
    button { margin-top: 16px; padding: 13px 20px; border: 0; border-radius: 8px; background: #287653; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #9cb9aa; cursor: not-allowed; }
    #fileList { margin-top: 8px; overflow-wrap: anywhere; }
    #message { min-height: 24px; }
    #error { color: #a12b2b; }
    #preview { max-height: 440px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px 12px; border: 1px solid #dce5df; text-align: left; overflow-wrap: anywhere; }
    th { background: #edf3ef; position: sticky; top: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Document Tasker</h1>
    <p class="muted">Choose a file, describe the result you want, review it, then download it.</p>

    <section class="card">
      <h2>1. Choose a file</h2>
      <input id="fileInput" type="file" multiple>
      <div id="fileList" class="muted"></div>

      <h2 style="margin-top:26px">2. Describe what you want</h2>
      <textarea id="instruction">Only give me two columns:
1. A column with all the names
2. A column with all the phone numbers</textarea>

      <button id="applyButton" type="button">Apply instruction to selected file</button>
      <p id="message" class="muted" role="status"></p>
      <p id="error" role="alert"></p>
    </section>

    <section class="card">
      <h2>Result</h2>
      <p id="summary" class="muted">Your result will appear here.</p>
      <div id="preview"></div>
      <button id="downloadButton" type="button" disabled>Download Excel result</button>
    </section>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let selectedFiles = [];
    let resultRows = null;

    $("fileInput").addEventListener("change", () => {
      selectedFiles = [...$("fileInput").files];
      $("fileList").textContent = selectedFiles.map(file => file.name).join(", ") || "No files selected.";
      clearResult();
    });

    $("applyButton").addEventListener("click", async () => {
      clearResult();

      const file = selectedFiles[0];
      const instruction = $("instruction").value.trim();

      if (!file) return showError("Choose a file first.");
      if (!instruction) return showError("Describe the result you want.");
      if (!window.XLSX) return showError("The Excel reader did not load. Check your internet connection and reload.");

      $("applyButton").disabled = true;
      $("message").textContent = "Reading the file and looking for the requested data…";

      try {
        const fields = fieldsRequested(instruction);
        if (!fields.length) {
          throw new Error("Ask for names, phone numbers, and/or table numbers.");
        }

        const data = await readFile(file);
        const rows = extractRequestedData(data, fields);

        if (!rows.length) {
          throw new Error("I couldn't identify the requested data in this file. It may be in an unsupported format or may not contain readable text.");
        }

        resultRows = rows;
        showPreview(rows);
        $("summary").textContent =
          `Found ${rows.length - 1} record(s). Review them before downloading.`;
        $("message").textContent = "Done. Your Excel result is ready.";
        $("downloadButton").disabled = false;
      } catch (err) {
        showError(err instanceof Error ? err.message : "The result could not be created.");
        $("message").textContent = "";
      } finally {
        $("applyButton").disabled = false;
      }
    });

    $("downloadButton").addEventListener("click", () => {
      if (!resultRows || !window.XLSX) return;

      try {
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.aoa_to_sheet(resultRows),
          "Result"
        );
        const fileName = `${selectedFiles[0].name.replace(/\.[^.]+$/, "")}-result.xlsx`;
        XLSX.writeFile(workbook, fileName);
      } catch {
        showError("Could not create the Excel download. Reload the page and try again.");
      }
    });

    async function readFile(file) {
      const ext = file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "";

      if (["xlsx", "xls", "xlsm", "xlsb", "csv", "tsv", "ods"].includes(ext)) {
        const workbook = XLSX.read(new Uint8Array(await file.arrayBuffer()), {
          type: "array",
          raw: false,
          cellDates: false
        });

        return {
          kind: "sheets",
          sheets: workbook.SheetNames.map(name => ({
            name,
            rows: XLSX.utils.sheet_to_json(workbook.Sheets[name], {
              header: 1,
              raw: false,
              defval: "",
              blankrows: false
            })
          }))
        };
      }

      if (ext === "docx") {
        const module = await import("https://cdn.jsdelivr.net/npm/mammoth@1.9.0/+esm");
        const mammoth = module.default || module;
        const doc = await mammoth.extractRawText({
          arrayBuffer: await file.arrayBuffer()
        });
        return { kind: "text", text: doc.value };
      }

      if (ext === "pdf") {
        const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/+esm");
        pdfjs.GlobalWorkerOptions.workerSrc =
          "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

        const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
        const pages = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();
          pages.push(content.items.map(item => item.str).join(" "));
        }

        return { kind: "text", text: pages.join("\n") };
      }

      if (["txt", "md", "json", "html", "log"].includes(ext)) {
        return { kind: "text", text: await file.text() };
      }

      throw new Error(
        `This page cannot read .${ext || "unknown"} files yet. Supported formats: Excel, CSV, TSV, DOCX, PDF, TXT, Markdown, JSON, HTML, and LOG.`
      );
    }

    function fieldsRequested(instruction) {
      const text = instruction.toLowerCase();
      const fields = [];

      if (/\bname(s)?\b/.test(text)) fields.push("name");
      if (/\b(phone|telephone|mobile|cell)\b/.test(text) ||
          (/\bnumber(s)?\b/.test(text) && /\bname(s)?\b/.test(text))) {
        fields.push("phone");
      }
      if (/\b(table|seat)\b/.test(text)) fields.push("table");

      return fields;
    }

    function extractRequestedData(data, fields) {
      const outputHeaders = [];
      if (fields.includes("name")) outputHeaders.push("NAME");
      if (fields.includes("phone")) outputHeaders.push("PHONE NUMBER");
      if (fields.includes("table")) outputHeaders.push("TABLE NUMBER");

      const output = [outputHeaders];
      const sheets = data.kind === "sheets"
        ? data.sheets
        : [{ name: "Document", rows: data.text.split(/\r?\n/).filter(Boolean).map(line => [line]) }];

      for (const sheet of sheets) {
        const rows = sheet.rows || [];
        const header = findHeader(rows);
        const dataStart = header ? header.index + 1 : 0;
        const sourceRows = rows.slice(dataStart);
        const indexes = inferColumns(sourceRows, header?.indexes);

        for (const row of sourceRows) {
          const values = row.map(value => String(value ?? "").trim());
          if (!values.some(Boolean)) continue;
          if (header && isRepeatedHeading(values, header.row)) continue;

          const parsed = parseRow(values);
          let name = indexes.name >= 0 ? values[indexes.name] : "";
          let phone = indexes.phone >= 0 ? findPhone(values[indexes.phone]) : "";
          let table = indexes.table >= 0 ? values[indexes.table] : "";

          if (!looksLikeName(name)) name = parsed.name;
          if (!phone) phone = parsed.phone;
          if (!table || !/\S/.test(table)) table = parsed.table;

          if (!name && !phone && !table) continue;

          const record = [];
          if (fields.includes("name")) record.push(name);
          if (fields.includes("phone")) record.push(phone);
          if (fields.includes("table")) record.push(table);
          output.push(record);
        }
      }

      return output.length > 1 ? output : [];
    }

    function findHeader(rows) {
      let best = null;

      for (let index = 0; index < Math.min(rows.length, 80); index++) {
        const row = rows[index] || [];
        let name = -1, phone = -1, table = -1, score = 0;

        row.forEach((cell, column) => {
          const key = normalize(cell);

          if (["name", "guestname", "fullname", "guestfullname"].includes(key)) {
            name = column;
            score += 3;
          } else if (key.includes("name") && !key.includes("additional")) {
            name = column;
            score += 2;
          }

          if (["phoneno", "phonenumber", "mobileno", "mobilenumber", "telephone"].includes(key) ||
              /phone|mobile|telephone|cell/.test(key)) {
            phone = column;
            score += 3;
          }

          if (/table|seat/.test(key)) {
            table = column;
            score += 2;
          }
        });

        if (score && (!best || score > best.score)) {
          best = { index, row, score, indexes: { name, phone, table } };
        }
      }

      return best;
    }

    function inferColumns(rows, headerIndexes = {}) {
      const width = Math.max(0, ...rows.slice(0, 150).map(row => row.length));
      const scores = Array.from({ length: width }, () => ({
        name: 0, phone: 0, tableLabel: 0, shortNumber: 0, numericValues: []
      }));

      for (const row of rows.slice(0, 150)) {
        row.forEach((cell, column) => {
          const value = String(cell ?? "").trim();
          if (!value) return;

          if (findPhone(value)) scores[column].phone += 1;
          if (looksLikeName(value)) scores[column].name += nameValueScore(value);
          if (/^(table|seat)\s*[-:#]?\s*[a-z0-9-]+$/i.test(value)) scores[column].tableLabel += 3;
          if (/^\d{1,3}$/.test(value)) {
            scores[column].shortNumber += 1;
            scores[column].numericValues.push(Number(value));
          }
        });
      }

      function highest(field) {
        let result = -1;
        let highestScore = 0;
        scores.forEach((score, column) => {
          if (score[field] > highestScore) {
            result = column;
            highestScore = score[field];
          }
        });
        return result;
      }

      let name = Number.isInteger(headerIndexes.name) && headerIndexes.name >= 0
        ? headerIndexes.name : highest("name");
      let phone = Number.isInteger(headerIndexes.phone) && headerIndexes.phone >= 0
        ? headerIndexes.phone : highest("phone");
      let table = Number.isInteger(headerIndexes.table) && headerIndexes.table >= 0
        ? headerIndexes.table : highest("tableLabel");

      // Infer a bare-number table column only when it does not look like a serial-number sequence.
      if (table < 0) {
        let bestScore = 0;
        scores.forEach((score, column) => {
          if (column === phone || score.shortNumber < 2) return;
          const uniqueRatio = new Set(score.numericValues).size / score.numericValues.length;
          const sequential = isMostlySequential(score.numericValues);
          if (uniqueRatio < 0.85 && !sequential && score.shortNumber > bestScore) {
            bestScore = score.shortNumber;
            table = column;
          }
        });
      }

      return { name, phone, table };
    }

    function parseRow(values) {
      const combined = values.join(" | ");
      const phone = findPhone(combined);
      const tableMatch = combined.match(/\b(?:table|seat)\s*[-:#]?\s*([A-Z0-9-]+)/i);
      const table = tableMatch ? tableMatch[1] : "";

      let name = "";
      const candidates = values.filter(value =>
        looksLikeName(value) && !/@/.test(value) && !findPhone(value)
      );

      if (candidates.length) {
        candidates.sort((a, b) => nameValueScore(b) - nameValueScore(a));
        name = candidates[0];
      }

      if (!name && phone) {
        const position = combined.indexOf(phone);
        let beforePhone = combined.slice(0, position);
        beforePhone = beforePhone.replace(/^\s*\d+[\s.)-]*/, "");
        beforePhone = beforePhone.replace(/\b(?:table|seat)\s*[-:#]?\s*[A-Z0-9-]+\b/ig, "");
        beforePhone = beforePhone.replace(/[|,;:-]+\s*$/, "").trim();
        if (looksLikeName(beforePhone)) name = beforePhone;
      }

      return { name, phone, table };
    }

    function findPhone(value) {
      // Ignore explicit table/seat labels so their digits are not joined to a phone number.
      const text = String(value ?? "").replace(/\b(?:table|seat)\s*[-:#]?\s*[A-Z0-9-]+/ig, " ");
      const matches = text.match(/\+?\d[\d\s()./-]{5,}\d/g) || [];

      for (const match of matches) {
        const digits = match.replace(/\D/g, "");
        if (digits.length >= 7 && digits.length <= 15) return match.trim();
      }
      return "";
    }

    function looksLikeName(value) {
      const text = String(value ?? "").trim();
      if (!text || findPhone(text) || /@|https?:\/\//i.test(text)) return false;
      if (/^\d+([.,]\d+)?$/.test(text) || !/[A-Za-zÀ-ÿ]/.test(text)) return false;
      if (/\b(phone|mobile|table no|serial no|email|location|status)\b/i.test(text)) return false;

      const words = text.split(/\s+/);
      return words.length <= 7 && text.length <= 80;
    }

    function nameValueScore(value) {
      const words = String(value).trim().split(/\s+/).length;
      return 2 + (words >= 2 ? 2 : 0) + (/[A-ZÀ-Ý]/.test(value) ? 1 : 0);
    }

    function isMostlySequential(values) {
      if (values.length < 3) return false;
      let sequentialSteps = 0;
      for (let i = 1; i < values.length; i++) {
        if (values[i] === values[i - 1] + 1) sequentialSteps++;
      }
      return sequentialSteps / (values.length - 1) > 0.75;
    }

    function normalize(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function isRepeatedHeading(values, heading) {
      return heading.length > 0 &&
        values.slice(0, heading.length).every((value, index) =>
          normalize(value) === normalize(heading[index])
        );
    }

    function showPreview(rows) {
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      rows[0].forEach(value => {
        const th = document.createElement("th");
        th.textContent = value;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);

      const tbody = document.createElement("tbody");
      rows.slice(1, 101).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      $("preview").replaceChildren(table);

      if (rows.length > 101) {
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = `Preview shows 100 records. The download contains all ${rows.length - 1}.`;
        $("preview").appendChild(note);
      }
    }

    function showError(text) {
      $("error").textContent = text;
    }

    function clearResult() {
      resultRows = null;
      $("downloadButton").disabled = true;
      $("error").textContent = "";
      $("message").textContent = "";
      $("summary").textContent = "Your result will appear here.";
      $("preview").replaceChildren();
    }
  </script>
</body>
</html>
