<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Tasker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 36px 20px;
      background: #f6f7f2;
      color: #203a31;
      font: 16px Arial, sans-serif;
    }
    main { width: min(100%, 980px); margin: auto; }
    h1 { font-size: 38px; margin: 0 0 8px; }
    h2 { font-size: 21px; margin: 0 0 16px; }
    p { line-height: 1.5; }
    .muted { color: #718079; }
    .card {
      margin-top: 24px;
      padding: 28px;
      background: white;
      border: 1px solid #dce5df;
      border-radius: 14px;
    }
    textarea {
      width: 100%;
      min-height: 145px;
      padding: 14px;
      border: 1px solid #cbd8d0;
      border-radius: 9px;
      resize: vertical;
      font: inherit;
      line-height: 1.5;
    }
    button {
      margin-top: 16px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #287653;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { background: #9cb9aa; cursor: not-allowed; }
    #fileList { margin-top: 8px; overflow-wrap: anywhere; }
    #message { min-height: 24px; }
    #error { color: #a12b2b; }
    #preview { max-height: 420px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px 12px; border: 1px solid #dce5df; text-align: left; }
    th { background: #edf3ef; }
    .sheet-title { margin: 18px 0 8px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Document Tasker</h1>
    <p class="muted">Choose a file, describe the result you want, review it, then download it.</p>

    <section class="card">
      <h2>1. Choose files</h2>
      <input id="files" type="file" multiple>
      <div id="fileList" class="muted"></div>

      <h2 style="margin-top:26px">2. Describe what you want</h2>
      <textarea id="instruction">Only give me two columns:
1. A column with all the names
2. A column with all the phone numbers</textarea>
      <button id="apply">Apply instruction to selected file</button>
      <p id="message" class="muted" role="status"></p>
      <p id="error" role="alert"></p>
    </section>

    <section class="card">
      <h2>Result</h2>
      <p id="summary" class="muted">Your result will appear here.</p>
      <div id="preview"></div>
      <button id="download" disabled>Download result</button>
    </section>
  </main>

  <script type="module">
    const $ = id => document.getElementById(id);
    let resultBlob = null;
    let resultFilename = "";

    $("files").addEventListener("change", () => {
      const chosen = [...$("files").files];
      $("fileList").textContent = chosen.length
        ? chosen.map(file => file.name).join(", ")
        : "No files selected.";
      clearResult();
    });

    $("apply").addEventListener("click", async () => {
      clearResult();
      const file = $("files").files[0];
      const instruction = $("instruction").value.trim();

      if (!file) return showError("Choose a file first.");
      if (!instruction) return showError("Enter the result you want.");

      $("apply").disabled = true;
      $("message").textContent = "Reading your file…";

      try {
        const ext = extension(file.name);
        let result;

        if (["xlsx", "xls", "xlsm", "xlsb", "csv", "tsv", "ods"].includes(ext)) {
          result = await processSpreadsheet(file, instruction);
        } else if (ext === "docx") {
          result = await processDocx(file, instruction);
        } else if (["txt", "md", "json", "html", "log"].includes(ext)) {
          result = processText(await file.text(), instruction, file.name);
        } else {
          throw new Error(
            `This page can select any file, but it cannot read the contents of .${ext || "unknown"} files yet. This version reads Excel, CSV, TSV, DOCX, TXT, Markdown, JSON, HTML, and LOG files.`
          );
        }

        resultBlob = result.blob;
        resultFilename = result.filename;
        $("summary").textContent = result.summary;
        if (result.tables) showTables(result.tables);
        else showText(result.text);
        $("download").disabled = false;
        $("message").textContent = "Done. Review the result, then download it.";
      } catch (err) {
        showError(err instanceof Error ? err.message : "The result could not be created.");
        $("summary").textContent = "The requested result could not be created.";
        $("message").textContent = "";
      } finally {
        $("apply").disabled = false;
      }
    });

    $("download").addEventListener("click", () => {
      if (!resultBlob) return;
      const url = URL.createObjectURL(resultBlob);
      const link = document.createElement("a");
      link.href = url;
      link.download = resultFilename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    async function processSpreadsheet(file, instruction) {
      requireNamesAndPhones(instruction);
      const XLSX = await loadXlsx();
      const workbook = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
      const output = XLSX.utils.book_new();
      const tables = [];
      let total = 0;

      for (const sheetName of workbook.SheetNames) {
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1, raw: true, defval: "", blankrows: true
        });
        const match = findColumns(rows);
        if (!match) continue;

        const outRows = [["NAME", "PHONE NUMBER"]];
        for (let r = match.headerRow + 1; r < rows.length; r++) {
          const row = rows[r] || [];
          const name = formattedCell(XLSX, sheet, r, match.nameCol, row[match.nameCol]);
          const phone = formattedCell(XLSX, sheet, r, match.phoneCol, row[match.phoneCol]);
          if (!name && !phone) continue;
          if (normalize(name) === "name" && normalize(phone).includes("phone")) continue;
          outRows.push([name, phone]);
        }
        if (outRows.length < 2) continue;

        XLSX.utils.book_append_sheet(
          output,
          XLSX.utils.aoa_to_sheet(outRows),
          safeSheetName(sheetName, output.SheetNames)
        );
        tables.push({ name: sheetName, rows: outRows });
        total += outRows.length - 1;
      }

      if (!tables.length) {
        throw new Error(
          "I could not find both a name heading and a phone heading in the workbook. Expected headings such as NAME and PHONE NO."
        );
      }

      const bytes = XLSX.write(output, { bookType: "xlsx", type: "array" });
      return {
        blob: new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }),
        filename: `${stem(file.name)}-names-and-phone-numbers.xlsx`,
        tables,
        summary: `Prepared ${total} rows in ${tables.length} sheet(s). The Excel file contains only NAME and PHONE NUMBER columns.`
      };
    }

    async function processDocx(file, instruction) {
      requireNamesAndPhones(instruction);
      const mammoth = await loadMammoth();
      const arrayBuffer = await file.arrayBuffer();
      const converted = await mammoth.convertToHtml({ arrayBuffer });
      const doc = new DOMParser().parseFromString(converted.value, "text/html");
      const tables = [...doc.querySelectorAll("table")];

      for (const table of tables) {
        const rows = [...table.querySelectorAll("tr")]
          .map(tr => [...tr.querySelectorAll("th,td")].map(cell => cell.textContent.trim()));
        const match = findColumns(rows);
        if (!match) continue;

        const outputRows = [["NAME", "PHONE NUMBER"]];
        for (const row of rows.slice(match.headerRow + 1)) {
          const name = row[match.nameCol] || "";
          const phone = row[match.phoneCol] || "";
          if (name || phone) outputRows.push([name, phone]);
        }

        if (outputRows.length > 1) {
          return {
            blob: makeCsv(outputRows),
            filename: `${stem(file.name)}-names-and-phone-numbers.csv`,
            tables: [{ name: "Extracted names and phone numbers", rows: outputRows }],
            summary: `Prepared ${outputRows.length - 1} rows from the Word document. Download the two-column CSV and open it in Excel.`
          };
        }
      }

      throw new Error(
        "I read the Word document, but could not find a table with both name and phone-number headings. Check that the document table has headings such as NAME and PHONE NO."
      );
    }

    function processText(text, instruction, filename) {
      const phraseMatch = instruction.match(/(?:containing|with|for|matching)\s+["“]?([^"\n”]+)["”]?/i);
      const phrase = phraseMatch?.[1]?.trim();
      const lines = text.split(/\r?\n/).filter(Boolean);
      const matches = phrase
        ? lines.filter(line => line.toLowerCase().includes(phrase.toLowerCase()))
        : lines;

      if (!matches.length) throw new Error("No matching text was found.");
      const resultText = matches.join("\n");
      return {
        blob: new Blob([resultText], { type: "text/plain;charset=utf-8" }),
        filename: `${stem(filename)}-result.txt`,
        text: resultText,
        summary: `Prepared ${matches.length} line(s) as a text download.`
      };
    }

    function findColumns(rows) {
      let best = null;
      let bestScore = 0;
      for (let r = 0; r < Math.min(rows.length, 60); r++) {
        let nameCol = -1, phoneCol = -1, nameScore = 0, phoneScore = 0;
        (rows[r] || []).forEach((value, c) => {
          const h = normalize(value);
          const ns = h === "name" ? 10 :
            ["guestname", "fullname", "guestfullname"].includes(h) ? 8 :
            h.includes("name") && !h.includes("additional") ? 5 : 0;
          const ps = ["phoneno", "phonenumber", "mobileno", "mobilenumber", "telephone"].includes(h) ? 10 :
            /phone|mobile|telephone|cell/.test(h) ? 7 : 0;
          if (ns > nameScore) { nameScore = ns; nameCol = c; }
          if (ps > phoneScore) { phoneScore = ps; phoneCol = c; }
        });
        if (nameCol >= 0 && phoneCol >= 0 && nameScore + phoneScore > bestScore) {
          best = { headerRow: r, nameCol, phoneCol };
          bestScore = nameScore + phoneScore;
        }
      }
      return best;
    }

    function formattedCell(XLSX, sheet, r, c, fallback) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c })];
      if (cell) {
        const value = XLSX.utils.format_cell(cell);
        if (value !== undefined && value !== null) return String(value).trim();
      }
      return fallback == null ? "" : String(fallback).trim();
    }

    function requireNamesAndPhones(instruction) {
      if (!/\bname(s)?\b/i.test(instruction) ||
          !/\b(phone|telephone|mobile|cell)\b/i.test(instruction)) {
        throw new Error("For this extraction, ask for both names and phone numbers.");
      }
    }

    function normalize(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function safeSheetName(name, existing) {
      let base = String(name || "Data").replace(/[\\/?*[\]:]/g, " ").slice(0, 31) || "Data";
      let candidate = base, n = 2;
      while (existing.includes(candidate)) {
        const suffix = ` ${n++}`;
        candidate = base.slice(0, 31 - suffix.length) + suffix;
      }
      return candidate;
    }

    function showTables(tables) {
      $("preview").replaceChildren();
      for (const item of tables) {
        const title = document.createElement("div");
        title.className = "sheet-title";
        title.textContent = item.name;
        $("preview").appendChild(title);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const trHead = document.createElement("tr");
        item.rows[0].forEach(value => {
          const th = document.createElement("th");
          th.textContent = value;
          trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        const tbody = document.createElement("tbody");
        item.rows.slice(1, 31).forEach(row => {
          const tr = document.createElement("tr");
          row.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.append(thead, tbody);
        $("preview").appendChild(table);
      }
    }

    function showText(text) {
      const pre = document.createElement("pre");
      pre.textContent = text;
      pre.style.whiteSpace = "pre-wrap";
      $("preview").replaceChildren(pre);
    }

    function makeCsv(rows) {
      const csv = rows.map(row => row.map(value =>
        `"${String(value ?? "").replace(/"/g, '""')}"`
      ).join(",")).join("\r\n");
      return new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
    }

    async function loadXlsx() {
      try {
        const module = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
        return module.default || module;
      } catch {
        throw new Error("Could not load the spreadsheet reader. Check your internet connection and reload.");
      }
    }

    async function loadMammoth() {
      try {
        const module = await import("https://cdn.jsdelivr.net/npm/mammoth@1.9.0/+esm");
        return module.default || module;
      } catch {
        throw new Error("Could not load the Word document reader. Check your internet connection and reload.");
      }
    }

    function extension(name) {
      return name.includes(".") ? name.split(".").pop().toLowerCase() : "";
    }
    function stem(name) { return name.replace(/\.[^.]+$/, ""); }

    function showError(text) { $("error").textContent = text; }

    function clearResult() {
      resultBlob = null;
      resultFilename = "";
      $("download").disabled = true;
      $("message").textContent = "";
      $("error").textContent = "";
      $("summary").textContent = "Your result will appear here.";
      $("preview").replaceChildren();
    }
  </script>
</body>
</html>
